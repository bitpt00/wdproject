{% extends "base.html" %}
{% block title %}预约申请｜校园实验室预约系统{% endblock %}
{% block content %}
<section class="page-heading"><div class="container"><p class="eyebrow">预约申请</p><h1>填写实验室预约信息</h1><p>D06 只增加登录，会话尚未用于限制预约权限，表单也不会保存。</p></div></section>
<section class="section compact-top">
    <div class="container form-layout">
        <form class="reservation-form" aria-label="实验室预约表单">
            <div class="form-row"><label for="lab">实验室</label><select id="lab" name="lab"><option value="">请选择实验室</option>{% for lab in labs %}<option value="{{ lab.id }}" {{ 'selected' if selected_lab_id == lab.id else '' }}>{{ lab.name }}（{{ lab.location }}）</option>{% endfor %}</select></div>
            <div class="form-columns"><div class="form-row"><label for="date">预约日期</label><input id="date" name="date" type="date"></div><div class="form-row"><label for="attendees">参加人数</label><input id="attendees" name="attendees" type="number" min="1"></div></div>
            <div class="form-columns"><div class="form-row"><label for="start-time">开始时间</label><input id="start-time" name="start_time" type="time"></div><div class="form-row"><label for="end-time">结束时间</label><input id="end-time" name="end_time" type="time"></div></div>
            <div class="form-row"><label for="purpose">使用目的</label><textarea id="purpose" name="purpose" rows="4"></textarea></div>
            <button class="button primary full" type="button" disabled>提交预约（后续版本开放）</button>
        </form>
        <aside class="stage-panel"><span class="prototype-label">当前边界</span><h2>认证不等于授权</h2><p>D06 只确认账号密码和登录状态。D07 才让不同角色拥有不同权限。</p></aside>
    </div>
</section>
{% endblock %}
